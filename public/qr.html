<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solomon Coatings - WhatsApp QR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; color:#fff; font-family:Arial,sans-serif; text-align:center; padding:30px; }
  h1 { color:#f90; font-size:24px; margin-bottom:10px; }
  p { color:#aaa; margin-bottom:20px; }
  .qr { background:#fff; padding:20px; display:inline-block; border-radius:10px; }
  .qr img { width:250px; height:250px; }
  .number { color:#f90; font-size:28px; font-weight:bold; margin:20px 0; }
  .info { color:#ccc; font-size:14px; max-width:400px; margin:20px auto; line-height:1.6; }
  .print-btn { background:#f90; color:#000; border:none; padding:12px 30px; font-size:16px; font-weight:bold; border-radius:6px; cursor:pointer; margin-top:20px; }
  .print-btn:hover { background:#ffaa00; }
</style>
</head>
<body>
<h1>Solomon Coatings</h1>
<p>Since 1988 | Powder Coating | Sandblasting | Shot Blasting</p>

<div class="qr">
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://wa.me/27605074461" alt="WhatsApp QR">
</div>

<div class="number">060 507 4461</div>

<p class="info">
  Scan with your phone camera to chat on WhatsApp.<br><br>
  Instant quotes | Colours | Blasting | Bookings<br><br>
  Mon-Thurs 8AM-4:45PM | Fri 8AM-2:45PM<br>
  Blackheath, Cape Town
</p>

<button class="print-btn" onclick="window.print()">Print This Page</button>

<p style="margin-top:30px; color:#666; font-size:11px;">
  Solomon Coatings 1988-2025
</p>
</body>
</html>
