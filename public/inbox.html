<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SC Inbox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial,sans-serif}
.phone{width:100%;max-width:420px;height:100vh;max-height:850px;background:#111;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 0 40px rgba(255,153,0,0.1)}
.header{background:#1a1a1a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.header h1{color:#f90;font-size:15px;display:flex;align-items:center;gap:8px}
.header h1 span{font-size:10px;color:#0a0;font-weight:normal}
.refresh-btn{background:#f90;color:#000;border:none;padding:6px 12px;border-radius:16px;font-weight:bold;font-size:11px;cursor:pointer}
.main-scroll{flex:1;overflow-y:auto;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23111" width="100" height="100"/><circle cx="50" cy="50" r="1" fill="%23222"/></svg>')}
.chat-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #1a1a1a;cursor:pointer;transition:background 0.2s}
.chat-row:hover{background:#1a1a1a}
.chat-row:active{background:#222}
.chat-avatar{width:44px;height:44px;border-radius:50%;background:#f90;color:#000;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;flex-shrink:0;margin-right:12px}
.chat-info{flex:1;min-width:0}
.chat-phone{color:#fff;font-size:14px;font-weight:600}
.chat-preview{color:#999;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-meta{text-align:right;flex-shrink:0;margin-left:10px}
.chat-time{color:#666;font-size:10px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{color:#888;font-size:16px;margin-bottom:8px}
.empty-sub{color:#555;font-size:12px;line-height:1.5}
.back-bar{background:#1a1a1a;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222;position:sticky;top:0;z-index:5}
.back-btn{color:#f90;font-size:16px;cursor:pointer;padding:4px 8px}
.chat-name{color:#fff;font-size:14px;font-weight:600}
.conversation{padding:10px 0 20px 0;display:flex;flex-direction:column}
.msg-wrapper{display:flex;margin:1px 12px}
.msg-wrapper.customer{justify-content:flex-start}
.msg-wrapper.bot{justify-content:flex-end}
.msg-bubble{max-width:75%;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.45;position:relative;word-wrap:break-word}
.customer .msg-bubble{background:#1e1e1e;color:#ddd;border-top-left-radius:2px}
.bot .msg-bubble{background:#f90;color:#000;border-top-right-radius:2px}
.msg-label{font-size:9px;margin-bottom:3px;opacity:0.5;text-transform:uppercase;letter-spacing:0.5px}
.reply-bar{background:#1a1a1a;padding:10px 12px;display:flex;align-items:center;gap:8px;border-top:1px solid #222}
.reply-input{flex:1;background:#222;border:1px solid #333;color:#fff;padding:10px 14px;border-radius:20px;font-size:13px;outline:none}
.reply-input:focus{border-color:#f90}
.send-btn{background:#f90;color:#000;border:none;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn:disabled{opacity:0.4}
.status{color:#0a0;font-size:10px;text-align:center;padding:4px}
.note-bar{background:#0d0d0d;color:#555;text-align:center;padding:8px;font-size:10px;border-top:1px solid #1a1a1a}
</style>
</head>
<body>
<div class="phone">
<div class="header">
<h1>📱 SC Inbox<span>●</span></h1>
<button class="refresh-btn" onclick="loadChats()">Refresh</button>
</div>
<div class="main-scroll" id="main"></div>
<div class="note-bar">Auto-refresh 3 min · 40 msgs · Reply enabled</div>
</div>
<script>
var API="/api/chats",REPLY="/api/reply",timer,curPhone=null,interval=180000;

function loadChats(){
clearTimeout(timer);curPhone=null;
document.getElementById("main").innerHTML='<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-title">Loading chats...</div></div>';
fetch(API).then(r=>r.json()).then(d=>{
if(!d.chats||!d.chats.length){
document.getElementById("main").innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">No conversations yet</div><div class="empty-sub">Send a WhatsApp to<br>060 507 4461<br>to start one</div></div>';
}else{
var h='';
d.chats.forEach(function(c){
var init=c.phone.replace(/\D/g,'').slice(-2);
h+='<div class="chat-row" onclick="showChat(\''+c.phone+'\')">';
h+='<div class="chat-avatar">'+init+'</div>';
h+='<div class="chat-info"><div class="chat-phone">'+c.phone+'</div><div class="chat-preview">'+(c.lastMsg||'No messages')+'</div></div>';
h+='<div class="chat-meta"><div class="chat-time">'+(c.time||'')+'</div></div>';
h+='</div>';
});
document.getElementById("main").innerHTML=h;
}
timer=setTimeout(loadChats,interval);
}).catch(function(){document.getElementById("main").innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Connection error</div></div>';timer=setTimeout(loadChats,interval)});
}

function showChat(phone){
clearTimeout(timer);curPhone=phone;
document.getElementById("main").innerHTML='<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-title">Loading...</div></div>';
fetch(API+"?phone="+phone).then(r=>r.json()).then(d=>{
var h='<div class="back-bar"><div class="back-btn" onclick="loadChats()">←</div><div class="chat-name">'+phone+'</div></div><div class="conversation">';
if(!d.messages||!d.messages.length)h+='<div class="empty-state"><div class="empty-sub">No messages yet</div></div>';
else d.messages.forEach(function(m){
h+='<div class="msg-wrapper '+(m.role==="user"?"customer":"bot")+'">';
h+='<div class="msg-bubble">';
h+='<div class="msg-label">'+(m.role==="user"?"Customer":"Bot")+'</div>';
h+=m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;');
h+='</div></div>';
});
h+='</div><div class="reply-bar"><input class="reply-input" id="replyText" placeholder="Type reply..." onkeypress="if(event.key===\'Enter\')sendReply()"><button class="send-btn" onclick="sendReply()" id="sendBtn">➤</button></div><div class="status" id="replyStatus"></div>';
document.getElementById("main").innerHTML=h;
var el=document.getElementById("replyText");if(el)el.focus();
var conv=document.querySelector(".conversation");if(conv)conv.scrollTop=conv.scrollHeight;
timer=setTimeout(function(){showChat(phone)},interval);
}).catch(function(){document.getElementById("main").innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load</div></div>'});
}

function sendReply(){
var t=document.getElementById("replyText"),msg=t.value.trim();
if(!msg||!curPhone)return;
var b=document.getElementById("sendBtn"),s=document.getElementById("replyStatus");
b.disabled=true;s.textContent="Sending...";
fetch(REPLY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to:curPhone,message:msg})}).then(r=>r.json()).then(function(res){
b.disabled=false;
if(res.success){t.value="";s.textContent="✓ Sent";s.style.color="#0a0";setTimeout(function(){s.textContent=""},2000);setTimeout(function(){showChat(curPhone)},400)}
else{s.textContent="✗ "+(res.error||"Failed");s.style.color="#f55"}
}).catch(function(){b.disabled=false;s.textContent="✗ Network error";s.style.color="#f55"});
}

loadChats();
</script>
</body>
</html>
