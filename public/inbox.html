<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SC Inbox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;background:#111;border-left:1px solid #222;border-right:1px solid #222}

/* Header */
.header{background:#1a1a1a;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222;flex-shrink:0}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f90,#f60);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#000;font-size:16px}
.header-info{flex:1}
.header-title{color:#fff;font-size:16px;font-weight:600}
.header-status{color:#0a0;font-size:12px;display:flex;align-items:center;gap:4px}
.status-dot{width:8px;height:8px;background:#0a0;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.header-actions{display:flex;gap:12px}
.icon-btn{background:none;border:none;color:#888;font-size:18px;cursor:pointer;padding:4px}
.icon-btn:hover{color:#f90}

/* Chat List */
.chat-list{flex:1;overflow-y:auto;background:#0f0f0f}
.chat-item{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #1a1a1a;cursor:pointer;gap:12px;transition:background 0.15s}
.chat-item:hover{background:#1a1a1a}
.chat-item:active{background:#222}
.chat-item.unread{background:#1a1a1a}
.chat-avatar{width:48px;height:48px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#f90;font-size:18px;flex-shrink:0}
.chat-avatar.online{border:2px solid #0a0}
.chat-details{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.chat-name{color:#fff;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{color:#666;font-size:11px;flex-shrink:0}
.chat-bottom{display:flex;justify-content:space-between;align-items:center}
.chat-preview{color:#888;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-badge{background:#f90;color:#000;font-size:11px;font-weight:bold;padding:2px 7px;border-radius:10px;flex-shrink:0;margin-left:6px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center;color:#555}
.empty-icon{font-size:56px;margin-bottom:16px;filter:grayscale(1)}
.empty-title{font-size:18px;color:#888;margin-bottom:8px}
.empty-text{font-size:13px;line-height:1.6;max-width:280px}

/* Conversation */
.conv-view{display:none;flex-direction:column;height:100%}
.conv-view.active{display:flex}
.conv-header{background:#1a1a1a;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222;flex-shrink:0}
.back-btn{background:none;border:none;color:#f90;font-size:20px;cursor:pointer;padding:4px 8px}
.conv-title{flex:1}
.conv-title .name{color:#fff;font-size:15px;font-weight:600}
.conv-title .status{color:#0a0;font-size:11px}
.conv-actions{display:flex;gap:8px}
.messages{flex:1;overflow-y:auto;padding:16px 12px;background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect fill="%230f0f0f" width="60" height="60"/><circle cx="30" cy="30" r="0.5" fill="%231a1a1a"/></svg>')}

/* Message Bubbles */
.msg-wrap{display:flex;margin-bottom:2px;animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg-wrap.in{justify-content:flex-start}
.msg-wrap.out{justify-content:flex-end}
.msg-bubble{max-width:78%;padding:8px 12px;border-radius:8px;font-size:14px;line-height:1.45;position:relative;word-wrap:break-word;box-shadow:0 1px 2px rgba(0,0,0,0.3)}
.msg-wrap.in .msg-bubble{background:#2a2a2a;color:#e0e0e0;border-top-left-radius:2px}
.msg-wrap.out .msg-bubble{background:#f90;color:#000;border-top-right-radius:2px}
.msg-sender{font-size:10px;font-weight:600;margin-bottom:2px;opacity:0.6;text-transform:uppercase;letter-spacing:0.5px}
.msg-time{font-size:10px;opacity:0.5;margin-top:4px;text-align:right}
.msg-wrap.out .msg-time{color:rgba(0,0,0,0.5)}
.msg-status{font-size:10px;margin-left:4px}
.date-divider{text-align:center;margin:16px 0;color:#555;font-size:11px;text-transform:uppercase;letter-spacing:1px;position:relative}
.date-divider::before,.date-divider::after{content:"";position:absolute;top:50%;width:30%;height:1px;background:#222}
.date-divider::before{left:0}
.date-divider::after{right:0}

/* Reply Bar */
.reply-bar{background:#1a1a1a;padding:10px 12px;display:flex;align-items:center;gap:10px;border-top:1px solid #222;flex-shrink:0}
.attach-btn{background:none;border:none;color:#888;font-size:22px;cursor:pointer;padding:4px}
.reply-input{flex:1;background:#2a2a2a;border:1px solid #333;color:#fff;padding:10px 14px;border-radius:20px;font-size:14px;outline:none;transition:border-color 0.2s}
.reply-input:focus{border-color:#f90}
.reply-input::placeholder{color:#555}
.send-btn{background:#f90;color:#000;border:none;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.1s}
.send-btn:active{transform:scale(0.95)}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}
.typing-indicator{color:#888;font-size:11px;padding:4px 16px;height:20px}

/* Footer */
.footer{background:#0d0d0d;color:#444;text-align:center;padding:6px;font-size:10px;border-top:1px solid #1a1a1a;flex-shrink:0}
</style>
</head>
<body>
<div class="app">

<!-- Header -->
<div class="header" id="header">
<div class="avatar">SC</div>
<div class="header-info">
<div class="header-title">Solomon Coatings</div>
<div class="header-status"><span class="status-dot"></span>Online</div>
</div>
<div class="header-actions">
<button class="icon-btn" onclick="loadChats()" title="Refresh">&#x21bb;</button>
</div>
</div>

<!-- Chat List -->
<div class="chat-list" id="chatList"></div>

<!-- Conversation View -->
<div class="conv-view" id="convView">
<div class="conv-header">
<button class="back-btn" onclick="backToList()">&#x2190;</button>
<div class="conv-title">
<div class="name" id="convName">Customer</div>
<div class="status" id="convStatus">● online</div>
</div>
<div class="conv-actions">
<button class="icon-btn" onclick="refreshChat()" title="Refresh">&#x21bb;</button>
</div>
</div>
<div class="messages" id="messages"></div>
<div class="typing-indicator" id="typing"></div>
<div class="reply-bar">
<button class="attach-btn">+</button>
<input type="text" class="reply-input" id="replyText" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendReply()">
<button class="send-btn" onclick="getAiSuggest()" id="aiBtn" title="AI Suggestion" style="background:#444;color:#f90;font-size:14px;margin-right:8px;">AI</button>
<button class="send-btn" onclick="sendReply()" id="sendBtn">&#x27a4;</button>
</div>
</div>

<!-- Footer -->
<div class="footer">Auto-refresh: 3 min · Last 40 messages · 7 days storage</div>

</div>

<script>
var API="/api/chats";
var REPLY="/api/reply";
var timer=null;
var curPhone=null;
var refreshMs=180000;

function loadChats(){
clearTimeout(timer);
curPhone=null;
document.getElementById("chatList").style.display="block";
document.getElementById("convView").classList.remove("active");
showLoading();

fetch(API).then(function(r){return r.json()}).then(function(d){
if(!d.chats||!d.chats.length){
document.getElementById("chatList").innerHTML='<div class="empty-state"><div class="empty-icon">&#x1f4ec;</div><div class="empty-title">No messages yet</div><div class="empty-text">Send a WhatsApp to<br><b>060 507 4461</b><br>to start a conversation</div></div>';
}else{
var h='';
d.chats.forEach(function(c){
var init=c.phone.replace(/\D/g,'').slice(-2);
var unread=c.unread?'<span class="chat-badge">'+c.unread+'</span>':'';
var cls=c.unread?'chat-item unread':'chat-item';
h+='<div class="'+cls+'" onclick="showChat(\''+c.phone+'\')">';
h+='<div class="chat-avatar">'+init+'</div>';
h+='<div class="chat-details">';
h+='<div class="chat-top"><div class="chat-name">'+c.phone+'</div><div class="chat-time">'+(c.time||'')+'</div></div>';
h+='<div class="chat-bottom"><div class="chat-preview">'+(c.lastMsg||'No messages')+'</div>'+unread+'</div>';
h+='</div></div>';
});
document.getElementById("chatList").innerHTML=h;
}
timer=setTimeout(loadChats,refreshMs);
}).catch(function(){
document.getElementById("chatList").innerHTML='<div class="empty-state"><div class="empty-icon">&#x26a0;</div><div class="empty-title">Connection error</div><div class="empty-text">Check your internet connection</div></div>';
timer=setTimeout(loadChats,refreshMs);
});
}

function showChat(phone){
clearTimeout(timer);
curPhone=phone;
document.getElementById("chatList").style.display="none";
document.getElementById("convView").classList.add("active");
document.getElementById("convName").textContent=phone;
document.getElementById("messages").innerHTML='<div class="empty-state"><div class="empty-icon">&#x1f4ac;</div><div class="empty-title">Loading...</div></div>';

fetch(API+"?phone="+phone).then(function(r){return r.json()}).then(function(d){
var h='';
if(!d.messages||!d.messages.length){
h+='<div class="empty-state"><div class="empty-icon">&#x1f4ec;</div><div class="empty-title">No messages</div></div>';
}else{
var lastDate='';
d.messages.forEach(function(m){
var date=m.time?m.time.split('T')[0]:'';
if(date&&date!==lastDate){
h+='<div class="date-divider">'+formatDate(date)+'</div>';
lastDate=date;
}
var cls=m.role==="user"?"in":"out";
var name=m.role==="user"?"Customer":"Bot (You)";
h+='<div class="msg-wrap '+cls+'">';
h+='<div class="msg-bubble">';
h+='<div class="msg-sender">'+name+'</div>';
h+=escapeHtml(m.content);
if(m.time)h+='<div class="msg-time">'+formatTime(m.time)+'</div>';
h+='</div></div>';
});
}
document.getElementById("messages").innerHTML=h;
scrollToBottom();
document.getElementById("replyText").focus();
timer=setTimeout(function(){showChat(phone)},refreshMs);
}).catch(function(){
document.getElementById("messages").innerHTML='<div class="empty-state"><div class="empty-icon">&#x26a0;</div><div class="empty-title">Failed to load</div></div>';
});
}

function sendReply(){
var input=document.getElementById("replyText");
var msg=input.value.trim();
if(!msg||!curPhone)return;
var btn=document.getElementById("sendBtn");
btn.disabled=true;
document.getElementById("typing").textContent="Sending...";

fetch(REPLY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to:curPhone,message:msg})}).then(function(r){return r.json()}).then(function(res){
btn.disabled=false;
document.getElementById("typing").textContent="";
if(res.success){
input.value="";
addMessage(msg,"out");
scrollToBottom();
}else{
document.getElementById("typing").textContent="Failed: "+(res.error||"Unknown");
document.getElementById("typing").style.color="#f55";
setTimeout(function(){document.getElementById("typing").textContent="";document.getElementById("typing").style.color=""},3000);
}
}).catch(function(){
btn.disabled=false;
document.getElementById("typing").textContent="Network error";
document.getElementById("typing").style.color="#f55";
setTimeout(function(){document.getElementById("typing").textContent="";document.getElementById("typing").style.color=""},3000);
});
}

function addMessage(text,dir){
var wrap=document.createElement("div");
wrap.className="msg-wrap "+dir;
var bubble=document.createElement("div");
bubble.className="msg-bubble";
var name=dir==="out"?"Bot (You)":"Customer";
bubble.innerHTML='<div class="msg-sender">'+name+'</div>'+escapeHtml(text)+'<div class="msg-time">'+formatTime(new Date().toISOString())+'</div>';
wrap.appendChild(bubble);
document.getElementById("messages").appendChild(wrap);
scrollToBottom();
}

function backToList(){
clearTimeout(timer);
loadChats();
}

function refreshChat(){
if(curPhone)showChat(curPhone);
}

function scrollToBottom(){
var el=document.getElementById("messages");
if(el)el.scrollTop=el.scrollHeight;
}

function showLoading(){
document.getElementById("chatList").innerHTML='<div class="empty-state"><div class="empty-icon">&#x1f4ac;</div><div class="empty-title">Loading chats...</div></div>';
}

function escapeHtml(t){
var d=document.createElement("div");
d.textContent=t;
return d.innerHTML;
}

function formatTime(iso){
try{var d=new Date(iso);return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0")}catch(e){return""}
}

function formatDate(d){
try{var date=new Date(d);return date.toLocaleDateString("en-ZA",{weekday:"short",day:"numeric",month:"short"})}catch(e){return d}
}

loadChats();

function getAiSuggest() {
  var input = document.getElementById("replyText");
  var msg = input.value.trim();
  if (!msg || !curPhone) return;
  var btn = document.getElementById("aiBtn");
  btn.disabled = true;
  btn.textContent = "...";
  fetch("/api/ai-suggest", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({phone: curPhone, message: msg})
  }).then(function(r){return r.json()}).then(function(res){
    btn.disabled = false;
    btn.textContent = "AI";
    if (res.suggestion) {
      input.value = res.suggestion;
      input.focus();
    } else {
      alert("AI: " + (res.error || "No suggestion"));
    }
  }).catch(function(){
    btn.disabled = false;
    btn.textContent = "AI";
    alert("AI request failed");
  });
}
</script>
</body>
</html>
