<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solomon Coatings - Colour Gallery</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; color:#fff; font-family: Arial, sans-serif; padding:10px; }
  h1 { text-align:center; padding:15px; color:#f90; font-size:20px; }
  .grid { display:grid; grid-template-columns: repeat(2,1fr); gap:10px; }
  .card { background:#2a2a2a; border-radius:8px; padding:8px; text-align:center; }
  .card img { width:100%; height:150px; object-fit:cover; border-radius:6px; background:#333; }
  .card span { font-size:12px; color:#ccc; margin-top:6px; display:block; }
  .back { background:#f90; color:#000; padding:12px; text-align:center; border-radius:6px; margin:15px 0; cursor:pointer; font-weight:bold; }
</style>
</head>
<body>
<h1>Solomon Coatings - Colour Gallery</h1>
<div class="grid" id="gallery"></div>
<div class="back" onclick="window.history.back()">Back</div>
<script>
var colors = [
  { name: "Red", img: "/photos/red-gloss-001.jpg" },
  { name: "Yellow", img: "/photos/yellow-001.jpg" },
  { name: "Green", img: "/photos/green-001.jpg" },
  { name: "Blue", img: "/photos/blue-001.jpg" },
  { name: "Orange", img: "/photos/orange-001.jpg" },
  { name: "Purple", img: "/photos/purple-001.jpg" },
  { name: "Black Gloss", img: "/photos/black-gloss-001.jpg" },
  { name: "Black Matt", img: "/photos/black-matte-001.jpg" },
  { name: "Hammered Black", img: "/photos/hammered-black-001.jpg" },
  { name: "White", img: "/photos/white-001.jpg" },
  { name: "Grey", img: "/photos/grey-001.jpg" },
  { name: "Dark Grey", img: "/photos/grey-dark-001.jpg" },
  { name: "Light Grey", img: "/photos/grey-light-001.jpg" },
  { name: "Brown", img: "/photos/brown-001.jpg" },
  { name: "Bronze", img: "/photos/bronze-001.jpg" },
  { name: "Charcoal", img: "/photos/charcoal-001.jpg" },
  { name: "Silver", img: "/photos/silver-001.jpg" },
  { name: "Gold", img: "/photos/gold-001.jpg" }
];
var html = "";
for (var i = 0; i < colors.length; i++) {
  html += '<div class="card"><img src="' + colors[i].img + '" onerror="this.style.display=\'none\';this.parentNode.innerHTML+=\'<div style=height:150px;background:#333;display:flex;align-items:center;justify-content:center;color:#f90;font-size:12px>No Image</div>\'"><span>' + colors[i].name + '</span></div>';
}
document.getElementById("gallery").innerHTML = html;
</script>
</body>
</html>
